name: CI-Build

on:
  push:
  pull_request:
  schedule:
    - cron: '21 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    uses: phhung-axonivy/github-workflows/.github/workflows/ci.yml@feature/MARP-4588-Improve-vulnerability-scanning-apply-zap
    secrets:
      mvnArgs: -Dmattermost.appToken=${{ secrets.MATTERMOST_TEST_CONTAINER_ADMIN_TOKEN }}
